[package]
name = "aeon-cli"
version = "0.3.0"
description = "The aeon command-line tool (built as a binary of the desktop app package): run pipelines, serve the local API and the MCP server"
edition = "2024"
license = "MIT"

[lib]
name = "aeon_cli"
path = "src/lib.rs"

[dependencies]
aeon-core = { path = "../core", default-features = false }
aeon-shared = { path = "../shared" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
log = "0.4"

[features]
default = ["sql"]
sql = ["aeon-core/sql"]

[dev-dependencies]
tempfile = "3"
