[package]
name = "aeon-cli"
version = "0.3.0"
description = "AeonDataStudio on the command line: run pipelines, serve the local API and the MCP server"
edition = "2024"
license = "MIT"

[[bin]]
name = "aeon"
path = "src/main.rs"

[dependencies]
aeon-core = { path = "../core", default-features = false }
aeon-shared = { path = "../shared" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
log = "0.4"

[features]
default = ["sql"]
sql = ["aeon-core/sql"]

[dev-dependencies]
tempfile = "3"
