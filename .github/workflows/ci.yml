# Tests, lints and a frontend build on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: it made the build cache over 6 GB, which pushed every other
  # cache out of GitHub's 10 GB limit. Test failures still show file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves caches (pull requests and tags can read them); caches saved by a
          # pull request are only visible to that pull request.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri-build expects the frontend output folder to exist.
      - name: Create dist folder
        shell: bash
        run: mkdir -p dist

      - name: Tests
        run: cargo test -p aeon-core -p aeon-cli -p aeondatastudio -p aeon-shared -p aeondatastudio-ui

      - name: Clippy
        run: cargo clippy -p aeon-core -p aeon-cli -p aeondatastudio -p aeondatastudio-ui -p aeon-shared --all-targets -- -D warnings

      - name: Build frontend (WebAssembly)
        run: cargo build -p aeondatastudio-ui --target wasm32-unknown-unknown
