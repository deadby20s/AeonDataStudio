# Builds installers for Windows, macOS (Apple silicon and Intel) and Linux.
#
# - Pushing a tag like `v0.1.1-alpha` builds everything and uploads it to a *draft* pre-release
#   for that tag; review the draft on GitHub and publish it.
# - Pull requests that change this file, and manual runs, only build and keep the installers
#   as workflow artifacts (no release), so the workflow can be checked safely.
#
# The version in the installers comes from src-tauri/tauri.conf.json, so bump it before tagging.
# In-app updates: see docs/development.md ("Auto-updates") for the signing key setup.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
            targets: wasm32-unknown-unknown
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            targets: wasm32-unknown-unknown,aarch64-apple-darwin
          - name: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            targets: wasm32-unknown-unknown,x86_64-apple-darwin
          - name: linux-x64
            platform: ubuntu-22.04
            args: ""
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.platform }}
    env:
      # With the update signing key set as a repository secret, installers are signed for the
      # in-app updater and latest.json is uploaded. Without it, plain installers are built.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }} ${{ env.HAS_UPDATER_KEY == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # Only a tag push creates or updates a release; other runs just build.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "AeonDataStudio ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what's new. Installers are not code-signed: on Windows, SmartScreen may warn (More info → Run anyway); on macOS, right-click the app → Open the first time."
          releaseDraft: true
          prerelease: true

      - name: Keep installers as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
