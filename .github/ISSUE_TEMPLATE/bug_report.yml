name: Bug report
description: Something went wrong or behaved unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for testing AeonDataStudio! A few details help a lot in reproducing the problem.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Imported a 2 GB JSONL file…
        2. Ran the "Web cleanup" pipeline…
        3. The run failed with "…"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the message shown in the app (for failed jobs, it's on the Jobs page).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → Open log folder, then drag AeonDataStudio.log here (or paste the last lines).
  - type: textarea
    id: data
    attributes:
      label: About your data
      description: Format, number of files, approximate size and number of documents. Please don't attach private data; a small sample that shows the problem is ideal.
      placeholder: e.g. 12 JSONL.gz files, 3 GB, about 2 million documents
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the sidebar.
      placeholder: v0.1.0 alpha
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS (Apple silicon), macOS (Intel), Linux]
    validations:
      required: true
