[package]
name = "aeondatastudio-ui"
version = "0.3.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
aeon-shared = { path = "shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1.7"

[workspace]
members = ["src-tauri", "shared", "core", "cli"]

# Applies to every crate in the workspace. Cargo ignores profiles in member crates.
# See https://tauri.app/concept/size/#cargo-configuration
# Debug builds: full debug info for our own crates, none for dependencies (DuckDB's C++ build
# included). That keeps target/ to a fraction of the size; panics in our code still show lines.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# No `panic = "abort"`: the backend relies on unwinding so a panicking background job is
# reported as failed instead of taking down the whole app.

# The WebAssembly frontend is optimized for size here instead of with Trunk's wasm-opt,
# which would be downloaded during the build (and fails offline).
[profile.release.package.aeondatastudio-ui]
opt-level = "z"
