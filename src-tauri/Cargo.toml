[package]
name = "aeondatastudio"
version = "0.3.0"
description = "Personal data studio for preparing AI pretraining data"
edition = "2024"
license = "MIT OR Apache-2.0"
# Two binaries: the app, and the aeon CLI (src/bin/aeon.rs), which the installers include.
default-run = "aeondatastudio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aeondatastudio_lib"
# Desktop only needs the rlib. The template's staticlib/cdylib are for iOS/Android, which this
# app doesn't target; building them cost 4+ GB in target/ and link time on every build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aeon-core = { path = "../core", default-features = false }
aeon-cli = { path = "../cli", default-features = false }
aeon-shared = { path = "../shared" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"

[features]
default = ["sql"]
sql = ["aeon-core/sql", "aeon-cli/sql"]

# The release profile lives in the workspace root Cargo.toml; Cargo ignores it here.
