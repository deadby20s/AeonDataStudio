[package]
name = "aeondatastudio"
version = "0.1.0"
description = "Personal data studio for preparing AI pretraining data"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aeondatastudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aeon-shared = { path = "../shared" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = "2"
parquet = "60"
arrow = { version = "60", default-features = false, features = ["json"] }
csv = "1"
flate2 = "1"
# Same major version as parquet uses, so only one copy of the zstd C library is linked.
zstd = "0.14"
rayon = "1"
unicode-normalization = "0.1"
whatlang = "0.18"
encoding_rs = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
hex = "0.4"
tiktoken-rs = "0.12"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
toml = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"

# The release profile lives in the workspace root Cargo.toml; Cargo ignores it here.
